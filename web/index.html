<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal Profile Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="card">
        <h1>Create Your Profile</h1>
        <p class="subtitle">Fill in the details below and submit to view your profile card.</p>

        <form action="ProfileServlet" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Ahmad bin Ali" required>

            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" name="studentId" placeholder="e.g. 2024123456" required>

            <label for="programme">Programme</label>
            <input type="text" id="programme" name="programme" placeholder="e.g. CS110 - Diploma in Computer Science" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="e.g. student@example.com" required>

            <label for="hobbies">Hobbies</label>
            <input type="text" id="hobbies" name="hobbies" placeholder="e.g. Reading, Gaming, Football">

            <label for="intro">Short Self-Introduction</label>
            <textarea id="intro" name="intro" rows="5" maxlength="500" placeholder="Tell us a little about yourself..."></textarea>

            <div class="actions">
                <button type="submit">Submit Profile</button>
                <button type="reset" class="secondary">Clear</button>
            </div>
        </form>
    </main>
</body>
</html>
